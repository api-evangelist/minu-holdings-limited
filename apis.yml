name: Minu Holdings Limited
description: >-
  Minu Holdings Limited operates minu.mx, Mexico's leading employee benefits and
  financial wellness platform. Minu provides employers with more than fifty benefits
  designed to attract, retain, and engage talent, including on-demand salary access
  (earned wage access), savings accounts, food and gas vouchers, payroll-linked
  loans, telemedicine, insurance, discounts, and financial education programs.
  Backed by 500 Global, Minu delivers these services to employees through its mobile
  app and integrates with employer payroll and HR systems. No public developer portal,
  API documentation, or OpenAPI specification was found during enrichment; the
  company operates a private/internal API surface (api.minu.mx responds but is not
  publicly documented).
